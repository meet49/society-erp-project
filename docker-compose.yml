name: society-erp

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongo", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      MONGODB_URI: mongodb://mongo:27017/society_erp?replicaSet=rs0
      MONGODB_DB_NAME: society_erp
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:4100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:?set SIGNED_URL_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      PAYMENT_DRIVER: ${PAYMENT_DRIVER:-mock}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL:-superadmin@societyerp.local}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:?set SEED_SUPER_ADMIN_PASSWORD in .env}
      TRUST_PROXY: "true"
    volumes:
      - uploads:/data/uploads
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/society_erp?replicaSet=rs0
      MONGODB_DB_NAME: society_erp
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:4100}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/uploads
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      PAYMENT_DRIVER: ${PAYMENT_DRIVER:-mock}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo-data:
  redis-data:
  uploads:
